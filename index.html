<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jornada Absenteísmo MediQuo</title>
<meta name="description" content="Protótipo navegável da jornada de gestão de absenteísmo entre ID, MediQuo Pro e App MediQuo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Outfit:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/frames.css">
<link rel="stylesheet" href="css/id.css">
<link rel="stylesheet" href="css/pro.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="shell-top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <p class="brand-title">Gestão de Absenteísmo</p>
        <p class="brand-sub">Protótipo de jornada · dados fictícios · sem backend</p>
      </div>
    </div>
    <nav class="route-switch" id="routeSwitch" aria-label="Rotas da jornada"></nav>
    <div class="top-actions">
      <button type="button" class="chip-btn" id="btnCompare">Comparar rotas</button>
      <button type="button" class="chip-btn ghost" id="btnReset" title="Restaurar dados de exemplo">Reiniciar</button>
    </div>
  </header>

  <section class="journey" aria-label="Etapas da jornada">
    <ol class="stepper" id="stepper"></ol>
  </section>

  <section class="step-note" id="stepNote" aria-live="polite"></section>

  <main class="stage" id="stage">
    <div class="stage-inner" id="stageInner"></div>
  </main>
</div>

<div class="overlay" id="compareOverlay" hidden>
  <div class="overlay-card wide" role="dialog" aria-modal="true" aria-labelledby="compareTitle">
    <div class="overlay-head">
      <h2 id="compareTitle">Comparar rotas</h2>
      <button type="button" class="icon-btn" data-close="compareOverlay" aria-label="Fechar">✕</button>
    </div>
    <div class="overlay-body" id="compareBody"></div>
  </div>
</div>

<div class="overlay light" id="pdfOverlay" hidden>
  <div class="overlay-card pdf" role="dialog" aria-modal="true" aria-labelledby="pdfTitle">
    <div class="overlay-head">
      <h2 id="pdfTitle">Atestado</h2>
      <button type="button" class="icon-btn" data-close="pdfOverlay" aria-label="Fechar">✕</button>
    </div>
    <div class="overlay-body pdf-body" id="pdfBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
